name: floor-watch

on:
  schedule:
    - cron: "7 * * * *"   # раз в час, в :07 (UTC); GitHub может задержать запуск на 5–20 минут
  workflow_dispatch:       # ручной запуск кнопкой Run workflow

permissions:
  contents: write          # чтобы сохранить последнюю цену в state.json

concurrency:
  group: floor-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить floor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          MIN_CHANGE_PCT: ${{ vars.MIN_CHANGE_PCT }}
        run: python watch.py
      - name: Сохранить цену
        run: |
          git config user.name "floor-watch"
          git config user.email "floor-watch@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "floor update" && git push)
